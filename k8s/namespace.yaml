apiVersion: v1
kind: Namespace
metadata:
  name: bankmore
  labels:
    name: bankmore
    app: bankmore
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bankmore-sa
  namespace: bankmore
  labels:
    app: bankmore
    component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bankmore-role
  namespace: bankmore
  labels:
    app: bankmore
    component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bankmore-rolebinding
  namespace: bankmore
  labels:
    app: bankmore
    component: rbac
subjects:
- kind: ServiceAccount
  name: bankmore-sa
  namespace: bankmore
roleRef:
  kind: Role
  name: bankmore-role
  apiGroup: rbac.authorization.k8s.io
