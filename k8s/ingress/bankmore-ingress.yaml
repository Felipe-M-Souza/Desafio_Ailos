apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bankmore-ingress
  namespace: bankmore
  labels:
    app: bankmore
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  ingressClassName: nginx
  rules:
  - host: bankmore.local
    http:
      paths:
      - path: /api/contas
        pathType: Prefix
        backend:
          service:
            name: conta-corrente-service
            port:
              number: 5009
      - path: /api/transferencias
        pathType: Prefix
        backend:
          service:
            name: transferencias-service
            port:
              number: 5010
      - path: /api/tarifas
        pathType: Prefix
        backend:
          service:
            name: tarifas-service
            port:
              number: 5011
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: conta-corrente-service
            port:
              number: 5009
      - path: /swagger
        pathType: Prefix
        backend:
          service:
            name: conta-corrente-service
            port:
              number: 5009
  - host: api.bankmore.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: conta-corrente-service
            port:
              number: 5009
  - host: transferencias.bankmore.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transferencias-service
            port:
              number: 5010
  - host: tarifas.bankmore.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tarifas-service
            port:
              number: 5011
