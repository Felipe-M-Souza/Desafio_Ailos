global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus próprio
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Métricas do sistema
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Métricas de containers
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Kafka Exporter
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Aplicação .NET (se configurada com métricas)
  - job_name: 'conta-corrente-api'
    static_configs:
      - targets: ['conta-corrente-api:5009']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Health Checks
  - job_name: 'health-checks'
    static_configs:
      - targets: ['conta-corrente-api:5009']
    metrics_path: '/health'
    scrape_interval: 30s
