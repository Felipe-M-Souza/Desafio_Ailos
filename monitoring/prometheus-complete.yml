global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus próprio
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Aplicação .NET com métricas
  - job_name: 'conta-corrente-api'
    static_configs:
      - targets: ['host.docker.internal:5009']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Health Checks da aplicação
  - job_name: 'health-checks'
    static_configs:
      - targets: ['host.docker.internal:5009']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 5s
